<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captura de Datos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 6px 12px; }
    th { background: #eee; }
    #seccionTabla { display: none; }
  </style>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario">
    <input type="hidden" id="id">

    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" required min="1" max="120"><br><br>

    <label for="cargo">Cargo:</label><br>
    <input type="text" id="cargo" required><br><br>

    <label for="correo">Correo:</label><br>
    <input type="email" id="correo" required><br><br>

    <label for="telefono">Teléfono (10 dígitos):</label><br>
    <input type="tel" id="telefono" required pattern="[0-9]{10}" maxlength="10"
           title="Escribe 10 dígitos, solo números"><br><br>

    <button type="button" id="btnRegistrar">Registrar</button>
    <button type="button" id="btnConsultar">Consultar</button>
    <button type="button" id="btnModificar">Modificar</button>
    <button type="button" id="btnEliminar">Eliminar</button>
  </form>

  <p id="estado"></p>

  <div id="seccionTabla">
    <h2>Registros</h2>
    <button type="button" id="btnCerrar">Cerrar tabla</button>
    <br><br>
    <input type="text" id="buscador" placeholder="Buscar por nombre...">

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Cargo</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

  <script>
    // Pega aquí la URL de tu implementación de Apps Script (termina en /exec)
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxwQm3GStaLnkr06MwIHW_mnVW97ZRPQ8P-UWTsqiO6ofe9GirTx4COGe4lUPAr26pp/exec";
    var registros = [];
    var tablaVisible = false;

    // ---------- Enviar datos al script ----------
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); })
        .catch(function (err) {
          return { ok: false, mensaje: "No se pudo conectar con el servidor" };
        });
    }

    // ---------- Datos del formulario (los 5 campos) ----------
    function datosFormulario() {
      return {
        nombre: document.getElementById("nombre").value.trim(),
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value.trim(),
        correo: document.getElementById("correo").value.trim(),
        telefono: document.getElementById("telefono").value.trim()
      };
    }

    // ---------- Botones activos según el estado ----------
    // Registrar: solo si NO hay un registro cargado
    // Modificar y Eliminar: solo si hay un registro cargado
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // ---------- REGISTRAR ----------
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      var datos = datosFormulario();
      datos.accion = "guardar";

      enviar(datos).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // ---------- CONSULTAR ----------
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      });
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        })
        .catch(function () {
          document.getElementById("estado").textContent =
            "Error: no se pudieron consultar los registros";
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        // Solo muestra los nombres que INICIAN con lo escrito
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());
        agregarCelda(tr, reg.nombre);
        agregarCelda(tr, reg.edad);
        agregarCelda(tr, reg.cargo);
        agregarCelda(tr, reg.correo);
        agregarCelda(tr, reg.telefono);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Modificar registro";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // ---------- CERRAR TABLA ----------
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;
      document.getElementById("nombre").value = reg.nombre;
      document.getElementById("edad").value = reg.edad;
      document.getElementById("cargo").value = reg.cargo;
      document.getElementById("correo").value = reg.correo;
      document.getElementById("telefono").value = reg.telefono;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);                     // sube al formulario
      document.getElementById("nombre").focus(); // cursor en el nombre
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Modificar registro'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      var datos = datosFormulario();
      datos.accion = "editar";
      datos.id = id;

      enviar(datos).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // ---------- ELIMINAR ----------
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // ---------- Mensaje al terminar cualquier acción ----------
    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent =
        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      if (respuesta.ok) limpiarFormulario();
      if (tablaVisible) cargarRegistros();  // refresca la tabla si está abierta
    }

    actualizarBotones();
  </script>

</body>
</html>
